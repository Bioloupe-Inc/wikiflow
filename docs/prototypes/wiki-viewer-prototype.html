const pages = {
 workspace:{title:'Workspace files',group:'Foundation',text:`The shared place for files that people and agents work with.\n\n## One place to work\n\nThe workspace holds complete, usable files. A sandbox is a working environment attached to it, not a second authority for file ownership.\n\n[Sandbox file sync](#sync) connects that working environment to the workspace.\n\n## Related rules\n\n- [Original uploads](#originals) preserve what was received.\n- [Access rules](#access) determine who can read or change a file.\n- [Agent tools](#tools) use the same workspace boundaries.`},
 sync:{title:'Sandbox file sync',group:'File lifecycle',before:`Keep a sandbox and its workspace aligned while files move between them.\n\n## An interrupted transfer\n\nIf a transfer is interrupted, start it again from the beginning. The incomplete copy stays unavailable.\n\nA file becomes available only after the complete transfer has been verified.\n\n## Transfer lifecycle\n\n\`\`\`mermaid\nflowchart LR\n  U[Transfer] --> V[Verify]\n  V --> A[Available]\n  U -->|interrupted| R[Restart]\n  R --> U\n\`\`\`\n\n## What stays true\n\n[Original uploads](#originals) remain untouched. The workspace exposes only complete files, and [access rules](#access) still apply throughout a transfer.\n\nProgress is explained through [upload status](#status). The [workspace](#workspace) remains the place where a finished file is used.`,after:`Keep a sandbox and its workspace aligned while files move between them.\n\n## An interrupted transfer\n\nIf a transfer is interrupted, resume it from the last confirmed chunk. The incomplete copy stays unavailable.\n\nA file becomes available only after the complete transfer has been verified.\n\n## Transfer lifecycle\n\n\`\`\`mermaid\nflowchart LR\n  U[Transfer] --> V[Verify]\n  V --> A[Available]\n  U -->|interrupted| R[Resume]\n  R --> U\n  click R href "#recovery" "Open retry and recovery"\n\`\`\`\n\n## What stays true\n\n[Original uploads](#originals) remain untouched. The workspace exposes only complete files, and [access rules](#access) still apply throughout a transfer.\n\nProgress is explained through [upload status](#status). The [workspace](#workspace) remains the place where a finished file is used.\n\n[Retry and recovery](#recovery) explains when a saved checkpoint can be reused.`},
 originals:{title:'Original uploads',group:'Data integrity',text:`An original is the file exactly as it was received.\n\n## Preserve the source\n\nKeep the uploaded original unchanged. Processing, extraction, and agent edits operate on working copies.\n\nA retry must not replace an original with an incomplete or transformed copy.\n\n## Where it is used\n\n[Sandbox file sync](#sync) moves working copies. [Workspace files](#workspace) make completed results available.\n\n> A successful retry changes how a file arrives. It does not change what counts as the original.`},
 access:{title:'Access rules',group:'Foundation',text:`A file is accessible through the permissions of its workspace.\n\n## The same boundary throughout\n\nStarting a transfer does not grant new access. Reading a file, resuming a transfer, and opening a result all stay within the workspace permission boundary.\n\nA change in access takes effect even if work is already in progress.\n\n## Related pages\n\nSee [workspace files](#workspace) and [agent runs](#runs).`},
 status:{title:'Upload status',group:'File lifecycle',before:`Explain where a transfer stands without exposing transfer internals.\n\n## An interruption\n\nShow an interrupted transfer as failed. Offer the user a way to start it again.\n\nKeep the original filename and destination visible, so the user knows which file needs attention.\n\n## Availability\n\nA file is available only after [sandbox file sync](#sync) confirms that the transfer is complete.\n\n[Activity](#activity) records the result, and [artifact previews](#previews) can open the completed file.`,after:`Explain where a transfer stands without exposing transfer internals.\n\n## An interruption\n\nShow an interrupted transfer as paused. Offer the user a way to resume it.\n\nKeep the original filename and destination visible, so the user knows which file needs attention.\n\n## Availability\n\nA file is available only after [sandbox file sync](#sync) confirms that the transfer is complete.\n\n[Retry and recovery](#recovery) explains resumable transfers. [Activity](#activity) records the result, and [artifact previews](#previews) can open the completed file.`},
 recovery:{title:'Retry and recovery',group:'File lifecycle',before:null,after:`Resume useful work without exposing an incomplete file.\n\n## Reuse confirmed progress\n\nContinue from the last confirmed chunk when the source file still matches the transfer being resumed.\n\nIf the source has changed, discard the checkpoint and start a new transfer.\n\n## Preserve the boundaries\n\n- Keep [original uploads](#originals) intact.\n- Apply the same [access rules](#access) when resuming.\n- Show the interruption through [upload status](#status).\n\nThe completion rule in [sandbox file sync](#sync) remains unchanged: verify the complete file before making it available.`},
 tools:{title:'Agent tools',group:'Agents',text:`Tools give an agent bounded ways to work with a project.\n\n## Files stay in their workspace\n\nFile operations use [workspace files](#workspace). A tool does not create a separate file inventory or permission system.\n\n[Agent runs](#runs) record which work was requested and what happened.`},
 runs:{title:'Agent runs',group:'Agents',text:`A run follows one attempt to carry out a user's request.\n\n## Work in context\n\nA run uses [agent tools](#tools) and follows the workspace's [access rules](#access).\n\nIts meaningful results appear in [activity](#activity), and its conversation belongs to a [session](#sessions).`},
 activity:{title:'Activity',group:'Product experience',text:`A compact account of meaningful work and its outcome.\n\n## Keep the result clear\n\nRecord completed work and interruptions that need attention. Details remain close to the thing they explain, including [upload status](#status) and [agent runs](#runs).`},
 previews:{title:'Artifact previews',group:'Product experience',text:`Read and inspect a completed file without leaving the workspace.\n\n## A view of the file\n\nThe preview reflects the file held in [workspace files](#workspace). It becomes available when [upload status](#status) confirms completion.\n\n[Exports](#exports) retain the file's identity outside the viewer.`},
 sessions:{title:'Sessions',group:'Agents',text:`A session keeps a conversation and its working context together.\n\n## Continuing work\n\nThe conversation can refer to earlier [agent runs](#runs) and return to the same [workspace files](#workspace).`},
 exports:{title:'Exports',group:'Product experience',text:`Take a usable copy of a completed artifact out of the workspace.\n\n## Keep the result faithful\n\nAn export corresponds to the file shown in [artifact previews](#previews). Its lineage can be traced to [original uploads](#originals).`}
};

function drawDesk(){const desk=app.querySelector('.context-desk'),svg=desk.querySelector('.desk-edges');const update=()=>{if(!desk.isConnected)return;const box=desk.getBoundingClientRect(),reader=desk.querySelector('.reader').getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);svg.innerHTML=[...desk.querySelectorAll('.context-card')].map(card=>{const r=card.getBoundingClientRect(),incoming=card.parentElement.dataset.direction==='in';const x1=incoming?r.right-box.left:r.left-box.left,x2=incoming?reader.left-box.left:reader.right-box.left,y1=r.top+r.height/2-box.top,y2=reader.top+Math.min(reader.height-70,100+(r.top-box.top)*.5)-box.top;return `<path class="${pages[card.dataset.cardId].status==='added'?'new-edge':''}" d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}"/>`}).join('')};const observer=new ResizeObserver(update);observer.observe(desk);cleanupGraphs.push(()=>observer.disconnect());requestAnimationFrame(update)}
async function renderDiagrams(epoch){const blocks=[...app.querySelectorAll('pre code.language-mermaid')];if(!blocks.length)return;const pending=blocks.map(code=>{const holder=document.createElement('div');holder.className='diagram';holder.setAttribute('aria-label','Transfer lifecycle diagram');holder.textContent='Transfer → Verify → Available';code.parentElement.replaceWith(holder);return {holder,source:code.textContent}});mermaidPromise??=import('https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs').then(module=>{module.default.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',themeVariables:{background:'#ffffff',primaryColor:'#f1ecf9',primaryTextColor:'#514660',primaryBorderColor:'#c8b8dc',lineColor:'#a09aa9',secondaryColor:'#eaf3ee',tertiaryColor:'#f5f6f9',fontFamily:'Inter, -apple-system, sans-serif',fontSize:'12px'},flowchart:{curve:'basis',htmlLabels:true,useMaxWidth:true}});return module.default});const mermaid=await mermaidPromise;for(let i=0;i<pending.length;i++){if(epoch!==renderEpoch)return;const {holder,source}=pending[i];const result=await mermaid.render(`mermaid-${epoch}-${i}`,source,holder);if(epoch!==renderEpoch)return;holder.innerHTML=result.svg;result.bindFunctions?.(holder);if(state.view==='changes'&&state.variant!=='B')holder.insertAdjacentHTML('beforeend','<span class="diagram-badge">Diagram changed</span>');holder.querySelectorAll('a').forEach(a=>{const target=(a.getAttribute('href')||a.getAttribute('xlink:href')||'').replace(/^#/,'');if(!pages[target])return;a.setAttribute('aria-label',`Open ${pages[target].title.toLowerCase()}`);a.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();selectTopic(target)})});}}

document.addEventListener('click',event=>{const topic=event.target.closest('[data-topic]');if(topic){selectTopic(topic.dataset.topic);return}const link=event.target.closest('a[href^="#"]');if(link&&pages[link.getAttribute('href').slice(1)]){event.preventDefault();selectTopic(link.getAttribute('href').slice(1));return}const view=event.target.closest('[data-view]');if(view){state.view=view.dataset.view;saveURL(true);render();return}if(event.target.closest('[data-scope]')){state.all=!state.all;saveURL(true);render();return}if(event.target.closest('[data-compare-highlight]')){state.view=state.view==='changes'?'proposed':'changes';saveURL(true);render()}});
const prototypeEnabled=['localhost','127.0.0.1'].includes(location.hostname)||location.protocol==='file:';document.querySelector('.prototype-switcher').hidden=!prototypeEnabled;
document.getElementById('previous-variant').addEventListener('click',()=>cycleVariant(-1));document.getElementById('next-variant').addEventListener('click',()=>cycleVariant(1));
const search=document.getElementById('search'),results=document.getElementById('search-results');search.addEventListener('input',()=>{const query=search.value.trim().toLowerCase();const matches=Object.values(pages).filter(p=>p.title.toLowerCase().includes(query)||p.group.toLowerCase().includes(query));results.innerHTML=matches.length?matches.map(p=>`<button data-topic="${p.id}">${esc(p.title)}<small>${esc(p.group)} · ${p.status==='context'?'Context':p.status==='added'?'Added':'Changed'}</small></button>`).join(''):'<div style="padding:12px;color:var(--muted);font-size:12px">No matching page</div>';results.hidden=!query});search.addEventListener('keydown',event=>{if(event.key==='Escape'){results.hidden=true;search.blur()}if(event.key==='Enter'){const first=results.querySelector('[data-topic]');if(first){selectTopic(first.dataset.topic);search.value='';search.blur()}}});document.addEventListener('click',event=>{if(!event.target.closest('.search-box'))results.hidden=true});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();search.focus();return}if(event.target.closest('input,textarea,[contenteditable]')||event.metaKey||event.ctrlKey||event.altKey)return;if(prototypeEnabled&&(event.key==='ArrowRight'||event.key==='ArrowLeft')){event.preventDefault();cycleVariant(event.key==='ArrowRight'?1:-1)}});
window.addEventListener('popstate',()=>{readURL();render()});readURL();saveURL(true);render();
</script>
